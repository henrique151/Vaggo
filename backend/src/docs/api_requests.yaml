            value: application/json
          - name: User-Agent
            value: insomnia/12.4.0
            description: ""
            disabled: false
        authentication:
          type: none
        scripts:
          afterResponse: >-
            const jsonBody = insomnia.response.json();


            if (jsonBody?.data?.accessToken) {
              insomnia.baseEnvironment.set('bearer_token', jsonBody.data.accessToken);
              insomnia.baseEnvironment.set('userId', jsonBody.data.user.id);
            }


            const setCookie = insomnia.response.headers.get('set-cookie');


            if (setCookie) {
              const match = setCookie.match(/refreshToken=([^;]+)/);

              if (match?.[1]) {
                insomnia.baseEnvironment.set('refresh_token', match[1]);
              }
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
